<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">상품 등록</title>
</head>
<body>
<h1 th:text="${formTitle}">상품 등록</h1>

    <form th:action="@{${formAction}}" th:object="${productForm}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" th:field="*{title}" required />
        </div>

        <div>
            <label for="author">작가</label>
            <input type="text" id="author" th:field="*{author}" />
        </div>

        <div>
            <label for="publisher">출판사</label>
            <input type="text" id="publisher" th:field="*{publisher}" />
        </div>

        <div>
            <label for="publishDate">출간일</label>
            <input type="date" id="publishDate" th:field="*{publishDate}" />
        </div>

        <div>
            <label for="price">가격</label>
            <input type="number" id="price" th:field="*{price}" required />
        </div>

        <div>
            <label for="thumbnailImg">썸네일 이미지 경로</label>
            <input type="text" id="thumbnailImg" th:field="*{thumbnailImg}" />
        </div>

        <div>
            <label for="detailImg">상세 이미지 경로</label>
            <input type="text" id="detailImg" th:field="*{detailImg}" />
        </div>

        <button type="submit">저장</button>
    </form>
</body>
</html>

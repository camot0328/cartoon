<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
</head>
<body>
    <h1>상품 리스트</h1>

    <!-- 🔍 검색 폼 -->
    <form action="/search" method="get" id="searchForm">
        <input type="text" name="keyword" id="searchInput" placeholder="책 제목 검색" />
        <button type="submit" class="btn-search">검색</button>
    </form>

    <!-- ✅ 상품 목록 출력 -->
    <ul class="product-list">
        <li th:each="product : ${products}" class="product-card">
            <strong class="product-title" th:text="${product.title}">제목</strong><br/>
            <span class="product-author" th:text="${product.author}">작가</span><br/>
            <span class="product-price" th:text="${product.price}">0</span>원<br/>
            <a class="btn-detail" th:href="@{/product/info/{id}(id=${product.id})}">상세보기</a>
            <hr>
        </li>
    </ul>
    <div class="pagination">
  <span th:if="${currentPage > 0}">
    <a th:href="@{/search(query=${keyword}, page=${currentPage - 1})}">이전</a>
  </span>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
    <a th:href="@{/search(query=${keyword}, page=${i})}" th:text="${i + 1}"></a>
  </span>

        <span th:if="${currentPage < totalPages - 1}">
    <a th:href="@{/search(query=${keyword}, page=${currentPage + 1})}">다음</a>
  </span>
    </div>
</body>
</html>

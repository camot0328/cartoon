<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>회원 목록</title>
</head>
<body>
  <h1>회원 목록</h1>

  <table border="1">
    <thead>
    <tr>
      <th>회원 ID</th>
      <th>닉네임</th>
      <th>가입일</th>
      <th>상세 보기</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
      <td th:text="${user.userid}">userid</td>
      <td th:text="${user.nickname}">nickname</td>
      <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>
      <td>
        <a th:href="@{'/admin/users/' + ${user.id}}">상세</a>
      </td>
    </tr>
    </tbody>
  </table>

  <div style="margin-top: 20px">
    <a href="/admin">← 관리자 대시보드로 돌아가기</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 검색 결과</title>
</head>
<body>
  <h1>회원 정보</h1>
  <p><strong>아이디:</strong> <span th:text="${user.userid}"></span></p>
  <p><strong>닉네임:</strong> <span th:text="${user.nickname}"></span></p>
  <p><strong>가입일:</strong> <span th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>

  <h2>구매 이력</h2>
  <table border="1">
    <thead>
    <tr>
      <th>주문 ID</th>
      <th>총 금액</th>
      <th>주문일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
      <td th:text="${order.id}"></td>
      <td th:text="${order.totalPrice}"></td>
      <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
  </table>

  <div>
    <a href="/admin">관리자 대시보드로 돌아가기</a>
  </div>
</body>
</html>

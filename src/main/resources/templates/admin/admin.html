<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
</head>
<body>
  <h1>관리자 대시보드</h1>

  <!-- 관리자 전용 메뉴만 표시 -->
  <div sec:authorize="hasRole('ADMIN')">
    <ul>
      <li><a href="/admin/products">상품 관리</a></li>
      <li><a href="/admin/users">회원 관리</a></li>
    </ul>

    <!-- 검색 기능 -->
    <form th:action="@{/admin/search}" method="get">
      <label for="type">검색 종류:</label>
      <select name="type" id="type">
        <option value="user">회원</option>
        <option value="product">상품</option>
      </select>

      <input type="text" name="keyword" placeholder="검색어 입력" required>
      <button type="submit">검색</button>
    </form>
  </div>

<!-- 관리자 권한 없을 경우 안내 -->
<div sec:authorize="!hasRole('ADMIN')">
  <p>⚠️ 이 페이지는 관리자만 접근할 수 있습니다.</p>
</div>

<div>
  <a href="/">메인으로</a>
</div>
</body>
</html>
